<!DOCTYPE html>
<html>
<head>
    <title>Akhil First Web Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script>
        // Initialize the map
        var map = L.map('map').fitWorld();
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        
        // TAMU landmarks coordinates
        var kyleField = [30.6084, -96.3402];
        var omBuilding = [30.6179, -96.3386];
        var academicBuilding = [30.6159, -96.3413];
        
        // Try to locate the user
        map.locate({
            setView: true,
            maxZoom: 16,
            enableHighAccuracy: true
        });
        
        // Location found event handler
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            L.marker(e.latlng).addTo(map)
                .bindPopup("You are within " + radius.toFixed(2) + " meters from this point")
                .openPopup();

            L.circle(e.latlng, radius).addTo(map);
        }
        
        // Location error event handler
        function onLocationError(e) {
            map.setView(kyleField, 15);
            alert("Location access was denied or unavailable. Map centered on Kyle Field.");
        }
        
        // Circle around Kyle Field with popup
        L.circle(kyleField, {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.4,
            radius: 300
        }).addTo(map).bindPopup("Kyle Field");
        
        // Custom icons for O&M and Academic Building
        var omIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var academicIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        L.marker(omBuilding, {icon: omIcon})
            .addTo(map)
            .bindPopup("O&amp;M Building");

        L.marker(academicBuilding, {icon: academicIcon})
            .addTo(map)
            .bindPopup("Academic Building");
        
        // Click event to show coordinates in popup
        var popup = L.popup();

        function onMapClick(e) {
            popup
                .setLatLng(e.latlng)
                .setContent("Coordinates: " + e.latlng.lat.toFixed(6) + ", " + e.latlng.lng.toFixed(6))
                .openOn(map);
        }

        map.on('click', onMapClick);
        
        // Register event handlers
        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);
    </script>
</body>
</html>
