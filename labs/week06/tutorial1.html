<!DOCTYPE html>
<html>
<head>
    <title>Akhil First Web Map - Tutorial 1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.1/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        h2 {
            margin: 10px;
        }

        #mapid {
            height: 600px;
            width: 100%;
        }
    </style>
</head>
<body>

<h2>Using GeoJSON with Leaflet</h2>
<div id="mapid"></div>

<script src="https://unpkg.com/leaflet@1.3.1/dist/leaflet.js"></script>
<script>
    var map = L.map('mapid').setView([39.8, -105.5], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);

    var myPoint = {
        "type": "Feature",
        "properties": {
            "name": "Coors Field",
            "amenity": "Baseball Stadium",
            "popupContent": "This is where the Rockies play!"
        },
        "geometry": {
            "type": "Point",
            "coordinates": [-104.99404, 39.75621]
        }
    };

    var myLines = [{
        "type": "LineString",
        "coordinates": [
            [-100, 40],
            [-105, 45],
            [-110, 55]
        ]
    }, {
        "type": "LineString",
        "coordinates": [
            [-105, 40],
            [-110, 45],
            [-115, 55]
        ]
    }];

    var myPolys = [{
        "type": "Feature",
        "properties": {
            "party": "Republican"
        },
        "geometry": {
            "type": "Polygon",
            "coordinates": [[
                [-104.05, 48.99],
                [-97.22, 48.98],
                [-96.58, 45.94],
                [-104.03, 45.94],
                [-104.05, 48.99]
            ]]
        }
    }, {
        "type": "Feature",
        "properties": {
            "party": "Democrat"
        },
        "geometry": {
            "type": "Polygon",
            "coordinates": [[
                [-109.05, 41.00],
                [-102.06, 40.99],
                [-102.03, 36.99],
                [-109.04, 36.99],
                [-109.05, 41.00]
            ]]
        }
    }];

    L.geoJSON(myPoint, {
        onEachFeature: function(feature, layer) {
            if (feature.properties && feature.properties.popupContent) {
                layer.bindPopup(feature.properties.popupContent);
            }
        }
    }).addTo(map);

    L.geoJSON(myLines, {
        style: {
            color: "#ff7800",
            weight: 5,
            opacity: 0.65
        }
    }).addTo(map);

    L.geoJSON(myPolys, {
        style: function(feature) {
            switch (feature.properties.party) {
                case 'Republican':
                    return {color: "#ff0000"};
                case 'Democrat':
                    return {color: "#0000ff"};
            }
        }
    }).addTo(map);
</script>

</body>
</html>
